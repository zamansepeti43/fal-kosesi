name: Apply credit UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate credit UI files
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              Path('app/page.tsx'): [
                  ('  const [credits, setCredits] = useState<number | null>(null);', 1),
                  ('  fetch("/api/credits", { cache: "no-store" })', 1),
              ],
              Path('app/fal/tarot/tarot-client.tsx'): [
                  ('  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");', 1),
                  ('  fetch("/api/credits/spend", {', 1),
              ],
          }

          for path, expectations in checks.items():
              text = path.read_text()
              for needle, count in expectations:
                  actual = text.count(needle)
                  if actual > count:
                      raise SystemExit(f'{path}: duplicate detected for {needle!r}: {actual}')
          print('Credit UI validation passed')
          PY
