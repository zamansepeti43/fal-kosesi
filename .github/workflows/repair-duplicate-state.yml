name: Repair duplicate injected state and effects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate injected state and effect blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('app/page.tsx'), Path('app/fal/tarot/tarot-client.tsx')]

          credit_state_home = '  const [credits, setCredits] = useState<number | null>(null);'
          credit_state_tarot = '  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");'

          credit_effect_home = '''  useEffect(() => {
    fetch("/api/credits", { cache: "no-store" })
      .then(async (response) => {
        if (!response.ok) return;
        const data = (await response.json()) as { credits?: number };
        setCredits(Number(data.credits ?? 0));
      })
      .catch(() => undefined);
  }, []);'''

          credit_effect_tarot = '''  useEffect(() => {
    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;
    setCreditStatus("checking");
    fetch("/api/credits/spend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: `tarot_${spreadId}` }),
    })
      .then(async (response) => {
        setCreditStatus(response.ok ? "ok" : "error");
      })
      .catch(() => setCreditStatus("error"));
  }, [selectedCards.length, spread.cards, spreadId, revealing, creditStatus]);'''

          changed = False
          for path in files:
              text = path.read_text()
              original = text

              if path.as_posix() == 'app/page.tsx':
                  lines = text.splitlines()
                  out = []
                  for line in lines:
                      if line == credit_state_home and out and out[-1] == credit_state_home:
                          continue
                      out.append(line)
                  text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
                  while credit_effect_home + '\n\n' + credit_effect_home in text:
                      text = text.replace(credit_effect_home + '\n\n' + credit_effect_home, credit_effect_home)

              if path.as_posix() == 'app/fal/tarot/tarot-client.tsx':
                  lines = text.splitlines()
                  out = []
                  for line in lines:
                      if line == credit_state_tarot and out and out[-1] == credit_state_tarot:
                          continue
                      out.append(line)
                  text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
                  while credit_effect_tarot + '\n\n' + credit_effect_tarot in text:
                      text = text.replace(credit_effect_tarot + '\n\n' + credit_effect_tarot, credit_effect_tarot)

              if text != original:
                  path.write_text(text)
                  changed = True

          print('Duplicate state/effect repair complete' if changed else 'No duplicate state/effect blocks found')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/fal/tarot/tarot-client.tsx
          git commit -m "Fix duplicate credit state and effects"
          git push
