name: Repair duplicate injected state and effects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate injected state and effect blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app/page.tsx': [
                  ('  const [credits, setCredits] = useState<number | null>(null);\n  const [credits, setCredits] = useState<number | null>(null);',
                   '  const [credits, setCredits] = useState<number | null>(null);'),
                  ('  useEffect(() => {\n    fetch("/api/credits", { cache: "no-store" })\n      .then(async (response) => {\n        if (!response.ok) return;\n        const data = (await response.json()) as { credits?: number };\n        setCredits(Number(data.credits ?? 0));\n      })\n      .catch(() => undefined);\n  }, []);\n\n  useEffect(() => {\n    fetch("/api/credits", { cache: "no-store" })\n      .then(async (response) => {\n        if (!response.ok) return;\n        const data = (await response.json()) as { credits?: number };\n        setCredits(Number(data.credits ?? 0));\n      })\n      .catch(() => undefined);\n  }, []);',
                   '  useEffect(() => {\n    fetch("/api/credits", { cache: "no-store" })\n      .then(async (response) => {\n        if (!response.ok) return;\n        const data = (await response.json()) as { credits?: number };\n        setCredits(Number(data.credits ?? 0));\n      })\n      .catch(() => undefined);\n  }, []);'),
              ],
              'app/fal/tarot/tarot-client.tsx': [
                  ('  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");\n  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");',
                   '  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");'),
                  ('  useEffect(() => {\n    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;\n    setCreditStatus("checking");\n    fetch("/api/credits/spend", {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ type: `tarot_${spreadId}` }),\n    })\n      .then(async (response) => {\n        setCreditStatus(response.ok ? "ok" : "error");\n      })\n      .catch(() => setCreditStatus("error"));\n  }, [selectedCards.length, spread.cards, spreadId, revealing, creditStatus]);\n\n  useEffect(() => {\n    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;\n    setCreditStatus("checking");\n    fetch("/api/credits/spend", {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ type: `tarot_${spreadId}` }),\n    })\n      .then(async (response) => {\n        setCreditStatus(response.ok ? "ok" : "error");\n      })\n      .catch(() => setCreditStatus("error"));\n  }, [selectedCards.length, spread.cards, spreadId, revealing, creditStatus]);\n\n  useEffect(() => {\n    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;\n    setCreditStatus("checking");\n    fetch("/api/credits/spend", {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ type: `tarot_${spreadId}` }),\n    })\n      .then(async (response) => {\n        setCreditStatus(response.ok ? "ok" : "error");\n      })\n      .catch(() => setCreditStatus("error"));\n  }, [selectedCards.length, spread.cards, spreadId, revealing, creditStatus]);',
                   '  useEffect(() => {\n    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;\n    setCreditStatus("checking");\n    fetch("/api/credits/spend", {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ type: `tarot_${spreadId}` }),\n    })\n      .then(async (response) => {\n        setCreditStatus(response.ok ? "ok" : "error");\n      })\n      .catch(() => setCreditStatus("error"));\n  }, [selectedCards.length, spread.cards, spreadId, revealing, creditStatus]);'),
              ],
          }

          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed = True

          if changed:
              print('Duplicate state/effect blocks repaired')
          else:
              print('No duplicate state/effect blocks found')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/fal/tarot/tarot-client.tsx
          git commit -m "Fix duplicate credit effects"
          git push
