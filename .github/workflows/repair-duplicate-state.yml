name: Validate duplicate injected state and effects

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate duplicate credit state and effects
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              Path('app/page.tsx'): [
                  ('  const [credits, setCredits] = useState<number | null>(null);', 1),
                  ('  useEffect(() => {\n    fetch("/api/credits", { cache: "no-store" })', 1),
              ],
              Path('app/fal/tarot/tarot-client.tsx'): [
                  ('  const [creditStatus, setCreditStatus] = useState<"idle" | "checking" | "ok" | "error">("idle");', 1),
                  ('  useEffect(() => {\n    if (selectedCards.length !== spread.cards || revealing || creditStatus !== "idle") return;\n    setCreditStatus("checking");\n    fetch("/api/credits/spend", {', 1),
              ],
          }

          for path, expectations in checks.items():
              text = path.read_text()
              for needle, maximum in expectations:
                  actual = text.count(needle)
                  if actual > maximum:
                      raise SystemExit(f'{path}: duplicate detected ({actual}): {needle[:80]!r}')
          print('Duplicate credit state/effect validation passed')
          PY
