name: Sync fortune visual assets

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/fortune/**"

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download visual assets
        run: node scripts/download-fortune-assets.mjs

      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fortune/*.jpg public/fortune/tarot/*.jpg
          if git diff --cached --quiet; then
            echo "No new visual assets to commit."
            exit 0
          fi
          git commit -m "Add premium fortune visual assets [skip ci]"
          git push
